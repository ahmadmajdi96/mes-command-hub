# Run the whole project with:  docker compose up
# Then open http://<your-server>:8121
# Point rms.manuqube.com and www.rms.manuqube.com (A records) at this server —
# the app accepts any hostname, so both domains work once DNS resolves.
# Database/auth connection settings come from the .env file in this folder.

services:
  app:
    build: .
    container_name: cortanex-rms
    ports:
      - "8121:8121"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=8121
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
