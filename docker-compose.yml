# Run the whole project with:  docker compose up
# Then open http://localhost:8112
# Database/auth connection settings come from the .env file in this folder.

services:
  app:
    build: .
    container_name: cortanex-rms
    ports:
      - "8112:8112"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=8112
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
